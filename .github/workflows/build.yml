name: Build and Publish to NuGet Test

on:
  push:
    branches:
      - main
    tags: 
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
      branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Get version number from tag
      if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
      env:
        TAG: ${{ github.ref_name }}
      run: echo "version=${TAG#v}" >> $GITHUB_ENV

    - name: Generate preview version number
      if: ${{ github.ref_type != 'tag' }}
      run: echo "version=1.0.0-preview.$(date +'%Y%m%d%H%M%S')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'

    - name: Build FlyingLogs.Analyzers
      run: dotnet build ./src/FlyingLogs.Analyzers/ --configuration Release /p:Version=${{ env.version }}

    - name: Build FlyingLogs.Core
      run: dotnet build ./src/FlyingLogs.Core/ --configuration Release /p:Version=${{ env.version }}

    - name: Pack
      run: dotnet build ./pack/FlyingLogs.Package/ --configuration Release /p:Version=${{ env.version }}

    - name: Run tests
      run: dotnet test --logger trx --results-directory "TestResults"

    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-results
        path: TestResults
      if: ${{ always() }}

    - name: Push to NuGet
      if: github.event_name  == 'push'
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push ./pack/FlyingLogs.Package/artifacts/packages/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json
